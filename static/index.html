<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eve</title>
<link rel="icon" href="/static/eve.jpg">
<style>
  :root {
    --bg: #0e1113; --panel: #151a1d; --panel2: #1a2024; --line: #242c31; --text: #e7eaeb; --muted: #8b979c;
    --teal: #3fd0b9; --amber: #e7b94c; --green: #5fd38b; --red: #e06a52; --hair: #d9683a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 300px 1fr 340px; height: 100vh; gap: 1px; background: var(--line); }
  .col { background: var(--bg); min-height: 0; display: flex; flex-direction: column; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 600; }

  /* left: Eve */
  .col.eve { align-items: center; padding: 20px 18px; gap: 14px; }
  .orb { position: relative; width: 150px; height: 150px; margin-top: 4px; flex: none; }
  .orb img { position: absolute; inset: 10px; width: 130px; height: 130px; border-radius: 50%; object-fit: cover;
             object-position: 50% 20%; border: 2px solid var(--line); transition: filter .4s; z-index: 2; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--line); transition: border-color .3s; }
  .ring.r2, .ring.r3 { opacity: 0; }
  [data-state="idle"] .orb img { filter: saturate(.75) brightness(.9); }
  [data-state="listening"] .ring.r1 { border-color: var(--teal); animation: pulse 1.1s ease-in-out infinite; }
  [data-state="thinking"] .ring.r1 { border: 3px solid transparent; border-top-color: var(--amber);
                                      border-right-color: var(--amber); animation: spin .9s linear infinite; }
  [data-state="speaking"] .ring.r1 { border-color: var(--green); }
  [data-state="speaking"] .ring.r2 { border-color: var(--green); animation: ripple 1.6s ease-out infinite; }
  [data-state="speaking"] .ring.r3 { border-color: var(--green); animation: ripple 1.6s ease-out .8s infinite; }
  @keyframes pulse { 50% { transform: scale(1.05); box-shadow: 0 0 28px #3fd0b955; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ripple { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.32); opacity: 0; } }
  .name { font-size: 22px; font-weight: 600; margin: 0; }
  .status { margin-top: -12px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  [data-state="listening"] .status .dot { background: var(--teal); }
  [data-state="thinking"] .status .dot { background: var(--amber); }
  [data-state="speaking"] .status .dot { background: var(--green); }
  .ptt { width: 100%; padding: 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2);
         color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; user-select: none;
         transition: background .15s, border-color .15s; }
  .ptt:hover { border-color: #33403f; }
  .ptt.on { background: #12332e; border-color: var(--teal); color: var(--teal); }
  .ptt:disabled { opacity: .45; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin-top: -8px; text-align: center; }
  kbd { font: 11px Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
        padding: 1px 5px; color: var(--text); background: var(--panel); }
  .card { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .col.eve { overflow: hidden; }
  .stitle { font-size: 15px; font-weight: 600; margin: 10px 0 2px; line-height: 1.3; overflow-wrap: anywhere; }
  .recent { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #sessions { overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; }
  .sess { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 7px 10px;
          color: var(--text); cursor: pointer; font: inherit; width: 100%; }
  .sess:hover { background: var(--panel); border-color: var(--line); }
  .sess.current { background: var(--panel2); border-color: #2d4a45; }
  .sess .t { font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .t.untitled { color: #b5bfc2; font-style: italic; }
  .sess .m { font-size: 11.5px; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }
  .bar { position: relative; height: 6px; border-radius: 3px; background: var(--panel2); margin: 10px 0 6px; overflow: visible; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--teal); width: 0; transition: width .4s; }
  .bar > b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--amber); border-radius: 1px; }
  .small { font-size: 12px; color: var(--muted); }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
         font: inherit; font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: #3a464b; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }

  /* middle: transcript */
  .chat { min-width: 0; }
  .chathead { padding: 18px 28px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .chathead .title { font-weight: 600; }
  .log { flex: 1; overflow-y: auto; padding: 22px 28px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 760px; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 8px; align-items: center; }
  .msg .bubble { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; }
  .msg.user .who { justify-content: flex-end; }
  .msg.user .bubble { background: #1f2a2e; border: 1px solid #2a383d; }
  .msg.eve .bubble { background: var(--panel); border: 1px solid var(--line); }
  .thought { align-self: flex-start; max-width: 760px; font-size: 12.5px; color: var(--muted); }
  .thought summary { cursor: pointer; list-style: none; display: inline-block; padding: 2px 10px; border-radius: 999px;
                     border: 1px dashed var(--line); }
  .thought summary::-webkit-details-marker { display: none; }
  .thought div { margin-top: 6px; padding: 10px 12px; border-left: 2px solid #3a3220; background: #13110c; border-radius: 6px;
                 color: #b9ad8c; font-style: italic; white-space: pre-wrap; max-height: 260px; overflow-y: auto; }
  .replay { margin-top: 4px; background: transparent; border: 1px solid transparent; color: var(--muted); font: inherit;
            font-size: 12px; padding: 2px 8px; border-radius: 999px; cursor: pointer; }
  .replay:hover { border-color: var(--line); color: var(--teal); background: var(--panel); }
  .heard { margin-top: 4px; font-size: 12px; color: var(--muted); text-align: right; }
  .heard summary { cursor: pointer; list-style: none; }
  .heard summary::-webkit-details-marker { display: none; }
  .heard div { margin-top: 4px; text-align: left; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 10px;
               color: #9aa6aa; font-style: italic; white-space: pre-wrap; }
  .msg.eve .who .av { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; object-position: 50% 20%; }
  .spoken { color: var(--muted); cursor: help; font-size: 12px; }
  .link { color: var(--teal); cursor: pointer; text-decoration: none; border-bottom: 1px dotted #3fd0b966; font-family: Consolas, monospace; font-size: 13px; }
  .link:hover { border-bottom-style: solid; }
  .tool { align-self: flex-start; font-size: 12.5px; color: var(--muted); max-width: 760px; }
  .tool summary { cursor: pointer; list-style: none; display: inline-flex; gap: 6px; align-items: center;
                  padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  .tool summary::-webkit-details-marker { display: none; }
  .tool pre { margin: 6px 0 0; padding: 10px 12px; background: #0b0e10; border: 1px solid var(--line); border-radius: 8px;
              white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; font-size: 12px; color: #b8c2c6; }
  .note { align-self: center; font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 3px 12px; }
  .note.err { color: var(--red); border-color: #5a2a22; background: #24130f; border-style: solid; border-radius: 12px; }
  .svcbtn { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .svcbtn.start { border-color: #2d4a45; color: var(--teal); }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  .empty b { color: var(--text); display: block; font-size: 17px; margin-bottom: 4px; }
  .composer { border-top: 1px solid var(--line); padding: 14px 28px 18px; display: flex; gap: 10px; }
  .composer input { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--text);
                    font: inherit; padding: 12px 14px; outline: none; }
  .composer input:focus { border-color: #35514c; }
  .send { background: var(--teal); color: #08201c; border: 0; border-radius: 12px; padding: 0 18px; font-weight: 700; cursor: pointer; }

  /* right: Frank */
  .frank { padding: 22px 18px; gap: 12px; overflow-y: auto; }
  .fhead { display: flex; align-items: center; justify-content: space-between; }
  .fname { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .busy { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .busy.on { color: var(--amber); border-color: #5e4c22; background: #2a2414; }
  .job { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .job .top { display: flex; gap: 8px; align-items: flex-start; }
  .job .num { font-family: Consolas, monospace; color: var(--muted); font-size: 12.5px; padding-top: 1px; }
  .job .task { flex: 1; font-size: 14px; }
  .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .pill.queued { background: #22282c; color: var(--muted); }
  .pill.running { background: #2a2414; color: var(--amber); }
  .pill.done { background: #15291e; color: var(--green); }
  .pill.failed { background: #2e1915; color: var(--red); }
  .pill.cancelled { background: #22282c; color: var(--muted); text-decoration: line-through; }
  .job .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .steps { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; color: #a8b3b7; }
  .steps li::before { content: "› "; color: var(--amber); }
  .job details { margin-top: 8px; font-size: 13px; }
  .job details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .job details div { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; color: #c9d1d4; max-height: 200px; overflow-y: auto; }
  .job .actions { margin-top: 10px; display: flex; gap: 8px; }
  .nojobs { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 8px; border: 1px dashed var(--line); border-radius: var(--radius); }

  .health { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .svc { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px;
         border: 1px solid var(--line); background: var(--panel); color: var(--muted); white-space: nowrap; }
  .svc i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .svc.down { border-color: #5a2a22; color: var(--red); background: #24130f; }
  .svc.down i { background: var(--red); }
  .svc .ms { font-family: Consolas, monospace; font-size: 11px; color: #6f7c81; }
  .timing { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .timing div { background: var(--panel2); border-radius: 8px; padding: 6px 4px; }
  .timing b { display: block; font-family: Consolas, monospace; font-size: 14px; font-weight: 600; }
  .timing span { font-size: 11px; color: var(--muted); }
  .steplog { margin-top: 8px; }
  .steplog > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .step { margin-top: 6px; border-left: 2px solid var(--line); padding-left: 8px; font-size: 12px; }
  .step.running { border-color: var(--amber); }
  .step.done { border-color: #2f6b49; }
  .step.failed { border-color: var(--red); }
  .step.note { border-color: #39464b; color: #a8b3b7; font-style: italic; }
  .step .sh { display: flex; gap: 6px; align-items: baseline; }
  .step .sh b { font-weight: 600; color: var(--text); }
  .step .sh .when { margin-left: auto; font-family: Consolas, monospace; font-size: 11px; color: #6f7c81; }
  .step.failed .sh b { color: var(--red); }
  .step pre { margin: 4px 0 0; padding: 6px 8px; background: #0b0e10; border: 1px solid var(--line); border-radius: 6px;
              white-space: pre-wrap; overflow-wrap: anywhere; max-height: 140px; overflow-y: auto; font-size: 11.5px; color: #b8c2c6; }
  .step pre.why { color: #c9b98a; font-style: italic; background: #14120b; border-color: #3a3220; }
  .step pre::before { content: attr(data-label); display: block; color: #6f7c81; font-size: 10.5px; margin-bottom: 2px; }

  /* Thinking mode selector */
  .thinkbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; background: var(--panel2); padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
  .thinkbtn { background: transparent; border: 0; color: var(--muted); font: inherit; font-size: 11.5px; font-weight: 600; padding: 5px 4px; border-radius: 6px; cursor: pointer; transition: background .15s, color .15s; }
  .thinkbtn:hover { color: var(--text); }
  .thinkbtn.active { background: #1c3531; color: var(--teal); box-shadow: 0 1px 3px #0006; }

  /* Audio output selector */
  .audiobar { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line);
              border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 12px; color: var(--muted); }
  .audioselect { background: transparent; border: 0; color: var(--text); font: inherit; font-size: 12px; font-weight: 600;
                 outline: none; cursor: pointer; max-width: 240px; text-overflow: ellipsis; }
  .audioselect option { background: var(--panel); color: var(--text); }
  .audiobtn { background: var(--panel2); border: 1px solid var(--line); color: var(--text); font: inherit; font-size: 11.5px;
              padding: 2px 8px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .audiobtn:hover { border-color: var(--teal); color: var(--teal); }

  /* Mobile elements (hidden on desktop) */
  .mobbar, .mob-ptt-bar { display: none; }

  @media (max-width: 1100px) { .app { grid-template-columns: 260px 1fr; } .frank { display: none; } }
  @media (max-width: 760px) {
    .app { display: flex; flex-direction: column; height: 100dvh; background: var(--bg); gap: 0; }
    .mobbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px;
              background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
    .mob-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mob-orb { position: relative; width: 38px; height: 38px; flex: none; }
    .mob-orb img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; object-position: 50% 20%; border: 2px solid var(--line); }
    [data-state="listening"] .mob-orb img { border-color: var(--teal); box-shadow: 0 0 12px #3fd0b966; }
    [data-state="thinking"] .mob-orb img { border-color: var(--amber); }
    [data-state="speaking"] .mob-orb img { border-color: var(--green); box-shadow: 0 0 12px #5fd38b66; }
    .mob-title { font-weight: 600; font-size: 15px; line-height: 1.2; }
    .mob-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .mobtabs { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 999px; border: 1px solid var(--line); }
    .mobtab { background: transparent; border: 0; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600;
              padding: 5px 11px; border-radius: 999px; cursor: pointer; }
    .mobtab.active { background: var(--panel2); color: var(--teal); }
    .col.eve, .col.frank, .col.chat { display: none; flex: 1; min-height: 0; width: 100%; }
    body[data-tab="chat"] .col.chat { display: flex; }
    body[data-tab="frank"] .col.frank { display: flex; }
    body[data-tab="session"] .col.eve { display: flex; overflow-y: auto; }
    .col.eve .orb, .col.eve .name, .col.eve .status, .col.eve #ptt, .col.eve #pttHint { display: none; }
    .chathead { padding: 8px 14px; }
    .log { padding: 14px; gap: 10px; }
    .mob-ptt-bar { display: flex; padding: 8px 14px 4px; background: var(--bg); border-top: 1px solid var(--line); }
    .mob-ptt-bar .ptt { padding: 14px; font-size: 15px; touch-action: none; }
    .composer { padding: 8px 14px 12px; border-top: 0; }
  }
</style>
</head>
<body data-state="idle" data-tab="chat">
<div class="app">
  <header class="mobbar">
    <div class="mob-left">
      <div class="mob-orb"><img src="/static/eve.jpg" alt="Eve"></div>
      <div>
        <div class="mob-title">Eve</div>
        <div class="mob-status"><span class="dot"></span><span id="mobStatusText">Idle</span></div>
      </div>
    </div>
    <div class="mobtabs">
      <button class="mobtab active" data-tab="chat">Chat</button>
      <button class="mobtab" data-tab="frank" id="mobTabFrank">Frank</button>
      <button class="mobtab" data-tab="session">Session</button>
    </div>
  </header>

  <section class="col eve">
    <div class="orb"><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div><img src="/static/eve.jpg" alt="Eve"></div>
    <h1 class="name">Eve</h1>
    <div class="status"><span class="dot"></span><span id="statusText">Idle</span></div>
    <button class="ptt" id="ptt">Hold to talk</button>
    <div class="hint" id="pttHint"><kbd>Right Ctrl</kbd> hold to send · tap to toggle</div>
    <div class="card session">
      <div class="row"><h2 style="margin:0">This session</h2><button class="btn" id="newSession">New session</button></div>
      <div class="stitle" id="stitle">New session</div>
      <div class="mono small" id="sid">—</div>
      <div class="bar" title="Context used. The amber mark is where compaction starts."><i id="ctxBar"></i><b id="ctxMark"></b></div>
      <div class="row small"><span id="ctxText">0 tokens</span><span id="ctxCap">compacts at 64K</span></div>
      <h2 style="margin:12px 0 4px">Thinking budget</h2>
      <div class="thinkbar" id="thinkBar">
        <button class="thinkbtn active" data-mode="256" title="256 thinking tokens (~3s)">256 tok</button>
        <button class="thinkbtn" data-mode="128" title="128 thinking tokens (~1.5s)">128 tok</button>
        <button class="thinkbtn" data-mode="tools" title="Think before calling tools, answer immediately after">Tools</button>
        <button class="thinkbtn" data-mode="off" title="No thinking pass (~0.3s to first words)">Off</button>
      </div>
      <h2 style="margin-top:12px">Last turn</h2>
      <div class="timing"><div><b id="tHeard">–</b><span>heard</span></div><div><b id="tThink">–</b><span>to answer</span></div><div><b id="tVoice">–</b><span>to voice</span></div></div>
    </div>
    <div class="recent">
      <h2>Recent sessions</h2>
      <div id="sessions"></div>
    </div>
  </section>

  <section class="col chat">
    <div class="chathead">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="title">Conversation <span class="small" id="voiceMode"></span></span>
        <div class="audiobar" title="Choose where Eve's voice plays">
          <span>🔊</span>
          <select class="audioselect" id="audioOut" aria-label="Audio output device"></select>
          <button class="audiobtn" id="testAudioBtn" type="button" title="Play a short voice check on the selected output">Test</button>
          <button class="audiobtn" id="refreshAudioBtn" type="button" title="Rescan connected speakers and headphones">↻</button>
        </div>
      </div>
      <div class="health" id="health"></div>
    </div>
    <div class="log" id="log"></div>
    <div class="mob-ptt-bar">
      <button class="ptt" id="mobPtt" type="button">Hold to talk · tap to toggle</button>
    </div>
    <form class="composer" id="composer">
      <input id="input" placeholder="Type to Eve, or hold to talk" autocomplete="off">
      <button class="send" type="submit">Send</button>
    </form>
  </section>

  <aside class="col frank">
    <div class="fhead"><span class="fname">Frank</span><span class="busy" id="busy">Idle</span></div>
    <h2>Jobs</h2>
    <div id="jobs"></div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
const STATES = { idle: "Idle", listening: "Listening…", thinking: "Thinking…", speaking: "Speaking" };
let audio = true, jobs = [];

// ---- text with clickable paths and links
const RX = /(https?:\/\/[^\s)\]>"']+)|([A-Za-z]:\\[^\s,;)\]"']*[^\s,;)\]"'.])|(\/(?:[\w.+@-]+\/)*[\w+@-](?:[\w.+@-]*[\w+@-])?(?=[\s,;:)\]"']|\.(?:\s|$)|$))/g;
function rich(text) {
  const frag = document.createDocumentFragment();
  let last = 0;
  for (const m of text.matchAll(RX)) {

let playCtx = null, nextPlayTime = 0;

function ensureAudioCtx() {

function playAudioChunk(b64, rate = 44100) {
  if (!browserAudio) return;

  const f32 = new Float32Array(samples);
  for (let i = 0; i < samples; i++) {
    let v = (bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8));
    if (v >= 0x8000) v -= 0x10000;
    f32[i] = v / 32768;
  }
  const buf = ctx.createBuffer(1, samples, rate);
  buf.getChannelData(0).set(f32);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  const startAt = Math.max(ctx.currentTime + 0.02, nextPlayTime);
  nextPlayTime = startAt + buf.duration;
  activeSources.add(src);
  src.onended = () => activeSources.delete(src);
  src.start(startAt);
}

// ---- Browser microphone capture (downsampled to 16 kHz mono 16-bit WAV)
let micStream = null, micCtx = null, micProc = null, micChunks = [], micRate = 16000;
async function startBrowserMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    addNote("Browser microphone requires HTTPS or localhost.", true);
    return false;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    if (!talk) {  // let go before the mic was ready (or while the permission prompt was up): don't leave it on
      stream.getTracks().forEach(t => t.stop());
      return true;
    }
    micStream = stream;
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    micRate = micCtx.sampleRate;
    micChunks = [];
    const src = micCtx.createMediaStreamSource(micStream);
    micProc = micCtx.createScriptProcessor(4096, 1, 1);
    micProc.onaudioprocess = (ev) => {
      if (talk) micChunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
    };
    src.connect(micProc);
    micProc.connect(micCtx.destination);
    return true;
  } catch (err) {
    addNote("Microphone permission denied or unavailable (" + err.message + ").", true);
    return false;
  }
}
function stopBrowserMicAndEncodeWav() {
  if (micProc) { try { micProc.disconnect(); } catch (_) {} micProc = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micCtx) { try { micCtx.close(); } catch (_) {} micCtx = null; }
  const totalLen = micChunks.reduce((a, c) => a + c.length, 0);
  if (!totalLen) return null;
  const full = new Float32Array(totalLen);
  let off = 0;
  for (const c of micChunks) { full.set(c, off); off += c.length; }
  micChunks = [];
  const targetRate = 16000;
  const ratio = micRate / targetRate;
  const outLen = Math.floor(full.length / ratio);
  if (outLen < targetRate * 0.3) return null;
  const wavBuf = new ArrayBuffer(44 + outLen * 2);
  const view = new DataView(wavBuf);
  const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  writeStr(0, "RIFF");
  view.setUint32(4, 36 + outLen * 2, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, targetRate, true);
  view.setUint32(28, targetRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, "data");
  view.setUint32(40, outLen * 2, true);
  for (let i = 0; i < outLen; i++) {
    const idx = Math.min(full.length - 1, Math.floor(i * ratio));
    const s = Math.max(-1, Math.min(1, full[idx]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  const bytes = new Uint8Array(wavBuf);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  }
  return btoa(bin);
}

// Talk key: Right Ctrl (or the button). Hold = talk and send on release.

const TAP_MS = 400, IDLE_LABEL = "Hold to talk · tap to toggle";

// On the PC, when Eve's global talk key is on, it owns Right Ctrl everywhere, this page included. The page

  else if (e.key === "Enter" && talk === "toggle") { e.preventDefault(); finish("send"); }
}, true);
window.addEventListener("keyup", (e) => { if (e.code === "ControlRight") { e.preventDefault(); if (!globalKey) release(); } }, true);
label(IDLE_LABEL);

// ---- initial state + live events
(async () => {
  const s = await (await fetch("/state")).json();
  audio = s.audio;
  if (!audio && !browserAudio) { $("ptt").disabled = true; $("pttHint").textContent = "Voice is off in this mode"; $("voiceMode").textContent = "text only"; }
  globalKey = !!s.hotkey && !isRemoteHost;
  if (globalKey) $("pttHint").innerHTML = "<kbd>Right Ctrl</kbd> hold to talk, in any window · with <kbd>Shift</kbd> to check first";
  if (s.think_mode) setThinkUI(s.think_mode);
  if (!isRemoteHost && s.audio_device === "browser") browserAudio = true;
  renderAudioDevices(s.audio_devices || [], s.audio_device || "default");
  if (browserAudio) post("/audio_mode", { browser_audio: true });
  setSession({ id: s.session, title: s.title, tokens: s.tokens, compact_at: s.compact_at, window: s.window });
  renderSessions(s.sessions, s.session);
  setInterval(async () => { const r = await (await fetch("/sessions")).json(); renderSessions(r.sessions, r.current); }, 60000);
  jobs = s.jobs; renderJobs(); setState(s.state); renderHealth(s.health);
  if (!s.transcript.length) empty();
  for (const m of s.transcript) addLine(m);
  const es = new EventSource("/events" + (browserAudio ? "?browser_audio=1" : ""));
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "user") addMsg("user", ev.text, null, ev.raw);
    else if (ev.type === "eve") addMsg("eve", ev.text, ev.spoken);
    else if (ev.type === "audio") playAudioChunk(ev.audio, ev.rate || 44100);
    else if (ev.type === "audio_stop") stopBrowserAudio();
    else if (ev.type === "audio_device") renderAudioDevices(ev.devices, ev.device);
    else if (ev.type === "think_mode") setThinkUI(ev.mode);
    else if (ev.type === "draft") { $("input").value = ev.text || ""; pendingRaw = ev.raw || null; $("input").focus(); }
    else if (ev.type === "tool") addTool(ev.name, ev.args || {}, ev.result || "");
    else if (ev.type === "note") addNote(ev.text);
    else if (ev.type === "error") addNote(ev.text, true);
    else if (ev.type === "thinking") addThinking(ev.text, ev.ms);
    else if (ev.type === "health") renderHealth(ev.services);
    else if (ev.type === "timing") setTiming(ev.stage, ev.ms);
    else if (ev.type === "state") setState(ev.state);
    else if (ev.type === "jobs") { jobs = ev.jobs; renderJobs(); }
    else if (ev.type === "session") { setSession(ev); currentSession = ev.id; if (ev.new) { empty(); addNote("New session started."); } }
    else if (ev.type === "sessions") { renderSessions(ev.sessions, ev.current);
      const me = ev.sessions.find(x => x.id === ev.current); if (me && me.titled) $("stitle").textContent = me.title, $("stitle").style.color = ""; }
  };
})();
</script>
</body>
